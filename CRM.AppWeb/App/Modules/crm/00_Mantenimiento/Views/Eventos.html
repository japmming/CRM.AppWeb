<div class="page-content">
    <div class="panel">
        <header class="panel-header">

            <h3 class="panel-title">Listado de Eventos <span id="titulo"></span></h3>
        </header>

        <div class="panel-body">
            <div class="form-horizontal">
                <div class="row">
                    <div class="col-24 " style="padding: 0 30px 15px 0; display: none" id="DIV_REGRESAR">
                        <button id="BTN_AsigSoliCodEdi_Regresar" class="btn btn-help pull-right"><i class="fa fa-arrow-left"></i> Regresar</button>
                    </div>
                </div>
                <jtse-grid id="grd_Evento" class="col-sm-24"></jtse-grid>
            </div>

        </div>
    </div>
</div>

<jtse-modal id="mdl_Editar_Evento">
    <div class="row">
        <style>
            .form-horizontal .control-label {
                text-align: left;
            }
        </style>
        <div class="col-sm-24 form-horizontal" data-container="FRM_MDL_Evento">
            <div class="col-sm-24">

                <div class="form-group">
                    <div class="col-sm-24">
                        <label class="control-label col-sm-24">Código *:</label>

                        <div class="col-sm-24">
                            <input type="text" class="form-control required" id="TXT_MDLEVENTO_CODIGO" maxlength="120" />
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-24">
                        <label class="control-label col-sm-24">Evento *:</label>
                        <div class="col-sm-24">
                            <input type="text" class="form-control required" id="TXT_MDlEVENTO_NOMBRE" maxlength="120" />
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-24">
                <div class="form-group">
                    <div class="col-sm-24">
                        <label class="control-label col-sm-24">Fecha de Inicio *:</label>
                        <div class="col-sm-24">
                            <div class="input-group">
                                <input type="text" id="TXT_MDLEVENTO_FECHA_INICIO" class="form-control validate-date required" placeholder="dd/mm/aaaa" autocomplete="off">
                                <span id="DTP_MDLEVENTO_FECHA_INICIO" class="input-group-btn" role="calendar">
                                    <button class="btn" type="button">
                                        <i class="fa fa-calendar"></i>
                                    </button>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-24">
                <div class="form-group">
                    <div class="col-sm-24">
                        <label class="control-label col-sm-24">Fecha de Termino *:</label>
                        <div class="col-sm-24">
                            <div class="input-group">
                                <input type="text" id="TXT_MDLEVENTO_FECHA_FIN" class="form-control validate-date required" placeholder="dd/mm/aaaa" autocomplete="off">
                                <span id="DTP_MDLEVENTO_FECHA_FIN" class="input-group-btn" role="calendar">
                                    <button class="btn" type="button">
                                        <i class="fa fa-calendar"></i>
                                    </button>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-24">
                <label class="control-label col-sm-24">Campaña *:</label>
                <div class="col-sm-24">
                    <select class="form-control required" id="CBO_MDLCampana"></select>
                </div>
            </div>
            <div class="col-sm-24">
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="control-label col-sm-24">Fecha de Inicio Campaña:</label>
                        <div class="col-sm-24">
                            <input type="text" id="TXT_MDLEVENTO_FECHA_INICIO_CAMPAÑA" class="form-control " readonly >
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="control-label col-sm-24">Fecha de Termino Campaña:</label>
                        <div class="col-sm-24">
                            <input type="text" id="TXT_MDLEVENTO_FECHA_FIN_CAMPAÑA" class="form-control " readonly >
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</jtse-modal>

<jtse-modal id="MDL_lista_leads">
    <div class="row">
        <view view-name="VW-MDLLista_Leads"></view>
    </div>
</jtse-modal>
