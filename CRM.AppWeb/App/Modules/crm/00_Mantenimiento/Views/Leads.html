<div class="page-content">
    <div class="panel">
        <header class="panel-header" id="hdr_LeadsLST_Titulo">
            <div>
                <h3 class="panel-title">Lista histórica de leads <span id="title"></span></h3>
            </div>
        </header>
        <div class="panel-body">
            <div class="form-horizontal" data-container="frmLeadsLST">
                <div class="col-sm-24">
                    <div class="row">

                    </div>
                    <div class="row">
                        <div class="col-sm-24">
                            <div class="form-group">

                                <div class="col-sm-3">
                                    <label id="lbl_LeadsLST_Asociado" class="control-label">Fecha inicio  :</label>
                                </div>
                                <div class="col-sm-4">
                                    <div class="input-group">
                                        <span class="input-group-addon" role="checkbox">
                                            <input type="checkbox" style="width: 13px" class="checkbox-inline" id="CHK_FECHA_INICIO" />
                                        </span>
                                        <input type="text" id="txt_FECHA_INICIO" class="form-control validate-date" placeholder="dd/mm/yyyy" disabled>
                                        <span id="dpt_FECHA_INICIO" class="input-group-btn" role="calendar">
                                            <button class="btn" type="button">
                                                <i class="fa fa-calendar"></i>
                                            </button>
                                        </span>
                                    </div>
                                </div>
                                <div class="col-sm-3">
                                    <label id="lbl_LeadsLST_Asociado" class="control-label">Fecha final  :</label>
                                </div>
                                <div class="col-sm-4">
                                    <div class="input-group">
                                        <span class="input-group-addon" role="checkbox">
                                            <input type="checkbox" style="width: 13px" class="checkbox-inline" id="CHK_FECHA_FINAL" />
                                        </span>
                                        <input type="text" id="txt_FECHA_FINAL" class="form-control validate-date" placeholder="dd/mm/yyyy" disabled>
                                        <span id="dpt_FECHA_FINAL" class="input-group-btn" role="calendar">
                                            <button class="btn" type="button">
                                                <i class="fa fa-calendar"></i>
                                            </button>
                                        </span>
                                    </div>
                                </div>
                                <div class="col-sm-3">
                                    <button class="btn btn-search-ico" id="btn_Buscar">Buscar</button>
                                </div>

                                <div class="col-sm-7 " style="padding: 0 30px 15px 0; display:none" id="DIV_RE">
                                    <button id="BTN_REG_EV" class="btn btn-help pull-right"><i class="fa fa-arrow-left"></i> Regresar</button>
                                </div>

                            </div>

                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-24">
                            <div class="form-group">
                                <jtse-grid id="grd_LeadsLST"></jtse-grid>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</jtse-modal>
